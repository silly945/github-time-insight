<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Time Insight</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --fg-dim: #656d76;
    --line: #d8dee4;
    --accent: #1f6feb;
    --card: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --fg-dim: #8b949e;
      --line: #30363d;
      --accent: #4493f8;
      --card: #161b22;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 296px;
    margin: 0;
    padding: 12px;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .brand { font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
  .brand .dot { color: var(--accent); }
  .hero {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .big {
    font-size: 30px;
    font-weight: 650;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .unit { font-size: 11px; color: var(--fg-dim); margin-top: 2px; }
  .line { font-size: 11.5px; color: var(--fg-dim); margin-top: 8px; }
  .row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .cell {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 6px;
    text-align: center;
  }
  .cell b {
    display: block;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .cell span { font-size: 10px; color: var(--fg-dim); }
  .actions { margin-top: 11px; display: flex; gap: 7px; }
  button {
    flex: 1;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }
  button.primary:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <div class="head">
    <div class="brand"><span class="dot">◉</span> GitHub Time Insight</div>
  </div>

  <div class="hero">
    <div class="big" id="today">0</div>
    <div class="unit" id="today-unit">min today</div>
    <div class="line" id="headline"></div>
  </div>

  <div class="row">
    <div class="cell">
      <b id="week">0</b>
      <span id="week-label">7d total</span>
    </div>
    <div class="cell">
      <b id="streak">0</b>
      <span id="streak-label">day streak</span>
    </div>
  </div>

  <div class="actions">
    <button id="open" class="primary">Open dashboard</button>
  </div>

<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
